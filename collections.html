<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collections | Saif Zulfiqar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="collection-page is-intro-done">
    <a class="page-logo" href="index.html#works" aria-label="Back to selected works">
      <img src="assets/logo.png" alt="" />
    </a>

    <main class="gallery-shell">
      <a class="back-link reveal is-visible" href="index.html#works">Back to selected works</a>
      <header class="gallery-header reveal is-visible">
        <p class="eyebrow">All Collections</p>
        <h1>Choose a collection</h1>
        <p>Select a body of work to explore the full gallery.</p>
      </header>

      <section class="collection-grid chooser-grid" aria-label="Choose collection">
        <a class="collection-card reveal reveal-slide" href="collection.html?collection=assorted-fan-arts">
          <div class="collection-image">
            <img src="assets/art/assorted-fan-arts/asuka-final.jpg" alt="" />
          </div>
          <div class="work-meta">
            <h3>Assorted Fan Arts</h3>
            <p>13 works</p>
          </div>
        </a>
        <a class="collection-card reveal reveal-slide" href="collection.html?collection=car-posters-photography">
          <div class="collection-image">
            <img src="assets/art/car-posters-photography/audi-poster-final.jpg" alt="" />
          </div>
          <div class="work-meta">
            <h3>Car Posters</h3>
            <p>8 works</p>
          </div>
        </a>
        <a class="collection-card reveal reveal-slide" href="collection.html?collection=cover-gals">
          <div class="collection-image cover-gals-thumb">
            <img src="assets/art/cover-gals/mystiquecover.jpg" alt="" />
          </div>
          <div class="work-meta">
            <h3>Cover Gals</h3>
            <p>13 works</p>
          </div>
        </a>
        <a class="collection-card reveal reveal-slide" href="collection.html?collection=original-art">
          <div class="collection-image">
            <img src="assets/art/original-art/tooken.jpg" alt="" />
          </div>
          <div class="work-meta">
            <h3>Original Art</h3>
            <p>17 works</p>
          </div>
        </a>
        <a class="collection-card reveal reveal-slide" href="collection.html?collection=processes">
          <div class="collection-image">
            <img src="assets/art/processes/dante-process.jpg" alt="" />
          </div>
          <div class="work-meta">
            <h3>Processes</h3>
            <p>3 works</p>
          </div>
        </a>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
